name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and NDK
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "platform-tools" \
            "ndk;25.2.9519653"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev
          pip install buildozer "cython<3.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Fix old sdkmanager broken on Java 17
        run: |
          NEW_SM=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          OLD_SM=/usr/local/lib/android/sdk/tools/bin/sdkmanager
          if [ -f "$OLD_SM" ]; then
            sudo mv "$OLD_SM" "${OLD_SM}.bak"
            printf '#!/bin/bash\nexec "%s" "$@"\n' "$NEW_SM" | sudo tee "$OLD_SM"
            sudo chmod +x "$OLD_SM"
          fi

      - name: Point buildozer at system SDK
        run: |
          sed -i "s|\[buildozer\]|android.sdk_path = $ANDROID_SDK_ROOT\nandroid.ndk_path = $ANDROID_SDK_ROOT/ndk/25.2.9519653\n\n[buildozer]|" buildozer.spec
          grep "sdk_path\|ndk_path" buildozer.spec

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-apk
          path: bin/*.apk
