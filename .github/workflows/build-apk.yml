name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache lld

      - name: Use Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"

      - name: Install buildozer and cython
        run: pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('mobile_version/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Accept Android SDK licences
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          find /usr/local/lib/android/sdk -name "sdkmanager" 2>/dev/null | head -1 | \
            xargs -I{} sh -c 'yes | {} --licenses' || true

      - name: Build APK
        working-directory: mobile_version
        run: yes | buildozer android debug 2>&1

      - name: Rename APK
        run: mv mobile_version/bin/*.apk mobile_version/bin/flashcards.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Flashcards (latest build)
          body: Scan the QR code or tap the link below to install on Android.
          files: mobile_version/bin/flashcards.apk
          make_latest: true
